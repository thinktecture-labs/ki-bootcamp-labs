[project]
name = "notebooks"
version = "0.1.0"
description = "Kernel environment for the notebook labs (Jupyter kernel \"Python (notebooks)\")"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.0",
    "langchain>=1.2",
    "langchain-openai>=1.1",
    "langchain-qdrant>=1.1",
    "langgraph>=0.4",
    "langfuse>=3.0",
    "python-dotenv>=1.0",
    # Lets participants `%pip install` extras into the kernel's venv during experiments.
    "pip>=25",
    "requests>=2.34.2",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "nbformat>=5.10",
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
